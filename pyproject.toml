[project]
name = "construction-defect-intelligence"
version = "0.1.0"
description = "AI-powered inspection report intelligence for structured extraction and semantic search"
requires-python = ">=3.11,<3.12"
dependencies = [
    "groq>=1.4.0",
    "numpy<2",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers==2.7.0",
    "streamlit>=1.58.0",
    "torch==2.2.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
